# Feed Registry -- single source of truth for all feed generators.
#
# To add a new feed without writing Python code:
#   1. Add an entry here using the generic generator
#   2. Adapt the selectors to the target website
#   3. Run: uv run python feed_generators/run_all_feeds.py --feed <name>

feeds:
  bundesarchiv:
    script: bundesarchiv_blog.py
    type: requests
    blog_url: https://www.bundesarchiv.de/aktuelles/

feeds:
  archivportal-d:
    script: generic_feed.py
    type: requests
    blog_url: https://www.archivportal-d.de/content/aktuelles
    enabled: true
    title: Aktuelles vom Archivportal-D
    description: aktuelle Neuigkeiten aus dem Archivportal-D
    selectors:
      article_selector: ".item"
      title_selector: ".title a"
      link_selector: ".title a"
      description_selector: ".description"
      date_selector: ".date"
      date_attr: ""
      date_format: "%d.%m.%Y"
      base_url: "https://www.archivportal-d.de"
